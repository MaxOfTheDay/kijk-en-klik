# Tests the app, then publishes it to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish only what the app needs, not tests, scripts or dev tooling.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css manifest.webmanifest sw.js src fonts icons _site/
      # Every deploy is a new service worker, so installed apps update.
      - name: Stamp the service worker version
        run: |
          sed -i "s/const VERSION = \"dev\";/const VERSION = \"${GITHUB_SHA::8}\";/" _site/sw.js
          grep -q "const VERSION = \"${GITHUB_SHA::8}\";" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
